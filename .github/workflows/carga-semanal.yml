name: Carga semanal ANP

# A carga roda toda quarta-feira, quando a ANP costuma publicar o novo arquivo,
# e pode ser disparada na mao.
on:
  schedule:
    - cron: "0 12 * * 3"
  workflow_dispatch:
    inputs:
      url:
        description: "URL do CSV da ANP (sobrescreve a variavel ANP_CSV_URL)"
        required: false

jobs:
  carregar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r loader/requirements.txt

      - name: Rodar testes do carregador
        run: python -m pytest loader/tests -q

      - name: Carregar dados
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANP_CSV_URL: ${{ inputs.url || vars.ANP_CSV_URL }}
        run: python loader/loader.py --url "$ANP_CSV_URL"
